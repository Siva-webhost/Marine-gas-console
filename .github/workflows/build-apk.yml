name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Generate icon and splash
        run: npx --yes @capacitor/assets@latest generate --android --iconBackgroundColor '#060c16' --iconBackgroundColorDark '#060c16' --splashBackgroundColor '#04080f' --splashBackgroundColorDark '#04080f'
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: marine-gas-console-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
